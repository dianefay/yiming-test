<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易命术 · 翻页阅读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0ede7;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .reader-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.08);
            padding: 2rem 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            height: 92vh;
            max-height: 820px;
            min-height: 500px;
        }

        /* 顶部栏 */
        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #ede3d6;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .reader-title {
            font-size: 1rem;
            font-weight: 600;
            color: #b87c4f;
            white-space: nowrap;
        }

        .mode-toggle-btn {
            background: #f3ede5;
            border: 1px solid #ddd2c4;
            border-radius: 2rem;
            padding: 0.2rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #5e5548;
            cursor: pointer;
            transition: 0.15s;
            flex-shrink: 0;
        }

        .mode-toggle-btn:hover {
            background: #e9e0d4;
            border-color: #b87c4f;
            color: #b87c4f;
        }

        .reader-progress {
            font-size: 0.8rem;
            color: #8f7e6b;
            background: #f3ede5;
            padding: 0.15rem 0.9rem;
            border-radius: 2rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ===== 内容区：独立滚动 ===== */
        .reader-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.2rem 0.2rem 0.5rem 0.2rem;
            margin-bottom: 0.5rem;
            /* 平滑滚动 */
            scroll-behavior: smooth;
            /* 自定义滚动条样式（可选） */
            scrollbar-width: thin;
            scrollbar-color: #d1c5b6 #f3ede5;
        }

        .reader-content::-webkit-scrollbar {
            width: 5px;
        }

        .reader-content::-webkit-scrollbar-track {
            background: #f3ede5;
            border-radius: 10px;
        }

        .reader-content::-webkit-scrollbar-thumb {
            background: #d1c5b6;
            border-radius: 10px;
        }

        .reader-content::-webkit-scrollbar-thumb:hover {
            background: #b87c4f;
        }

        .content-columns {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .content-column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .column-label {
            font-size: 0.7rem;
            color: #aa9f90;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .content-category {
            font-size: 0.8rem;
            color: #b87c4f;
            background: #fff0e6;
            display: inline-block;
            padding: 0.15rem 0.8rem;
            border-radius: 2rem;
            margin-bottom: 0.6rem;
            align-self: flex-start;
            flex-shrink: 0;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #b87c4f;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .special-tag {
            font-size: 0.75rem;
            font-weight: 400;
            color: #b1624b;
            background: #fff0e6;
            padding: 0.05rem 0.7rem;
            border-radius: 2rem;
            display: inline-block;
            margin-left: 0.6rem;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }

        .content-original {
            font-family: '华文行楷', 'STXingkai', '方正行楷', 'KaiTi', cursive;
            font-size: 1.05rem;
            font-weight: bold;
            background: #f9f5ef;
            padding: 0.6rem 0.9rem;
            border-radius: 1rem;
            line-height: 1.8;
            color: #2c2b28;
            border-left: 4px solid #b87c4f;
            flex: 1;
        }

        .content-trans {
            font-family: 'PingFang SC', '微软雅黑', 'Helvetica Neue', sans-serif;
            font-size: 0.95rem;
            color: #4b3e2e;
            line-height: 1.8;
            flex: 1;
        }

        .content-eval {
            font-family: 'PingFang SC', '微软雅黑', 'Helvetica Neue', sans-serif;
            font-size: 0.85rem;
            color: #b1624b;
            background: #fff0e6;
            padding: 0.3rem 0.7rem;
            border-radius: 0.8rem;
            margin-top: 0.3rem;
            white-space: pre-line;
            flex-shrink: 0;
        }

        .loading {
            text-align: center;
            padding: 3rem 0;
            color: #8f7e6b;
        }

        /* ===== 底部导航 ===== */
        .reader-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.7rem;
            border-top: 1px solid #ede3d6;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .footer-nav {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .footer-nav a {
            font-size: 0.8rem;
            color: #8f7e6b;
            text-decoration: none;
            cursor: pointer;
            transition: 0.15s;
            padding: 0.1rem 0.1rem;
            border-bottom: 2px solid transparent;
        }

        .footer-nav a:hover {
            color: #b87c4f;
            border-bottom-color: #b87c4f;
        }

        .footer-nav a.active-link {
            color: #b87c4f;
            border-bottom-color: #b87c4f;
        }

        .jump-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #8f7e6b;
            flex-shrink: 0;
        }

        .jump-control select {
            padding: 0.2rem 0.6rem;
            border-radius: 2rem;
            border: 1px solid #ddd2c4;
            background: white;
            font-size: 0.8rem;
            color: #2c2b28;
            cursor: pointer;
            max-width: 180px;
        }

        .jump-control select:focus {
            outline: none;
            border-color: #b87c4f;
        }

        /* ===== 翻页按钮：固定在底部 ===== */
        .reader-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.7rem;
            border-top: 1px solid #ede3d6;
            flex-shrink: 0;
            gap: 1rem;
            margin-top: 0.3rem;
        }

        .nav-btn {
            background: #e2d9cf;
            color: #2c2b28;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            min-width: 90px;
            flex-shrink: 0;
        }

        .nav-btn:hover:not(:disabled) {
            background: #d1c5b6;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn-primary {
            background: #b87c4f;
            color: white;
        }

        .nav-btn-primary:hover:not(:disabled) {
            background: #9a623d;
        }

        .nav-center {
            font-size: 0.8rem;
            color: #8f7e6b;
            text-align: center;
            flex: 1;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: #8f7e6b;
            text-decoration: none;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .back-link:hover {
            color: #b87c4f;
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 700px) {
            body {
                padding: 0.5rem;
            }

            .reader-container {
                padding: 1.2rem 1rem 1rem;
                height: 96vh;
                max-height: 96vh;
                border-radius: 1.2rem;
                min-height: 400px;
            }

            .content-columns {
                flex-direction: column;
                gap: 0.8rem;
            }

            .content-title {
                font-size: 1.2rem;
            }

            .content-original {
                font-size: 0.95rem;
                padding: 0.5rem 0.7rem;
                line-height: 1.7;
            }

            .content-trans {
                font-size: 0.9rem;
                line-height: 1.7;
            }

            .content-eval {
                font-size: 0.8rem;
            }

            .column-label {
                display: none;
            }

            .nav-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
                min-width: 70px;
            }

            .jump-control select {
                max-width: 130px;
                font-size: 0.7rem;
                padding: 0.15rem 0.5rem;
            }

            .reader-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 0.4rem;
            }

            .footer-nav {
                justify-content: center;
            }

            .jump-control {
                justify-content: center;
            }

            .header-left {
                flex-wrap: wrap;
                gap: 0.4rem;
            }

            .reader-title {
                font-size: 0.9rem;
            }

            .mode-toggle-btn {
                font-size: 0.65rem;
                padding: 0.1rem 0.7rem;
            }

            .special-tag {
                font-size: 0.65rem;
                margin-left: 0.3rem;
                padding: 0 0.5rem;
            }

            .reader-progress {
                font-size: 0.7rem;
                padding: 0.1rem 0.7rem;
            }

            .reader-nav {
                padding-top: 0.5rem;
                gap: 0.5rem;
                flex-wrap: nowrap;
            }

            .nav-center {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 400px) {
            .reader-container {
                padding: 0.8rem 0.6rem 0.8rem;
                border-radius: 1rem;
                height: 98vh;
                max-height: 98vh;
            }

            .content-title {
                font-size: 1rem;
            }

            .content-original {
                font-size: 0.85rem;
                padding: 0.4rem 0.6rem;
            }

            .content-trans {
                font-size: 0.8rem;
            }

            .nav-btn {
                padding: 0.4rem 0.7rem;
                font-size: 0.7rem;
                min-width: 55px;
            }

            .jump-control select {
                max-width: 100px;
                font-size: 0.65rem;
            }

            .footer-nav a {
                font-size: 0.7rem;
            }

            .reader-title {
                font-size: 0.8rem;
            }

            .mode-toggle-btn {
                font-size: 0.6rem;
                padding: 0.05rem 0.5rem;
            }
        }

        /* 横屏适配 */
        @media (max-height: 500px) and (orientation: landscape) {
            .reader-container {
                height: 98vh;
                max-height: 98vh;
                padding: 0.8rem 1.2rem 0.6rem;
                border-radius: 1rem;
            }

            .content-title {
                font-size: 1rem;
                margin-bottom: 0.2rem;
            }

            .content-original {
                font-size: 0.85rem;
                padding: 0.3rem 0.6rem;
                line-height: 1.5;
            }

            .content-trans {
                font-size: 0.8rem;
                line-height: 1.5;
            }

            .content-columns {
                gap: 0.8rem;
            }

            .content-category {
                font-size: 0.7rem;
                padding: 0.1rem 0.6rem;
                margin-bottom: 0.3rem;
            }

            .reader-header {
                padding-bottom: 0.4rem;
                margin-bottom: 0.4rem;
            }

            .reader-nav {
                padding-top: 0.4rem;
                margin-top: 0;
            }

            .nav-btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.7rem;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
<div class="reader-container" id="app">
    <!-- 顶部栏 -->
    <div class="reader-header">
        <div class="header-left">
            <span class="reader-title" id="mainTitle">📖 易命术 · 📜 顺序阅读</span>
            <button class="mode-toggle-btn" id="modeToggleBtn">切换阅读模式</button>
        </div>
        <span class="reader-progress" id="progressDisplay">加载中...</span>
    </div>

    <!-- 内容区：独立滚动，按钮不随之跳动 -->
    <div class="reader-content" id="contentArea">
        <div class="loading">📚 加载中...</div>
    </div>

    <!-- 底部导航 -->
    <div class="reader-footer">
        <div class="footer-nav" id="footerNav"></div>
        <div class="jump-control">
            <span>跳转：</span>
            <select id="jumpSelect"></select>
        </div>
    </div>

    <!-- 翻页按钮：固定在底部 -->
    <div class="reader-nav">
        <button class="nav-btn" id="prevBtn" disabled>◀ 上一页</button>
        <span class="nav-center" id="pageInfo">—</span>
        <button class="nav-btn nav-btn-primary" id="nextBtn">下一页 ▶</button>
    </div>

    <a href="index.html" class="back-link">🏠 返回主菜单</a>
</div>

<script>
    // ======================== 全局 ========================
    let bookData = [];
    let currentMode = 'sequential';
    let currentCategory = '全部';
    let filteredData = [];
    let currentPage = 0;

    const CATEGORY_ORDER = ['环境与自律', '言语与社交', '心性与情绪', '处事与决策', '人际与边界', '根基与识己'];
    const SPECIAL_CATEGORIES = ['总纲', '结语', '其他'];
    const EXCLUDED_TITLES = ['呜呼·过渡'];

    const contentArea = document.getElementById('contentArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const progressDisplay = document.getElementById('progressDisplay');
    const footerNav = document.getElementById('footerNav');
    const jumpSelect = document.getElementById('jumpSelect');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const mainTitle = document.getElementById('mainTitle');

    // ======================== 数据加载 ========================
    async function loadBook() {
        try {
            const res = await fetch('book.json');
            if (!res.ok) throw new Error('加载 book.json 失败');
            const data = await res.json();
            bookData = data.books.filter(art => !EXCLUDED_TITLES.includes(art.title));
            if (bookData.length === 0) {
                contentArea.innerHTML = '<div class="loading">⚠️ 暂无内容</div>';
                return;
            }
            switchMode('sequential');
        } catch (err) {
            console.error(err);
            contentArea.innerHTML = '<div class="loading">⚠️ 数据加载失败，请刷新重试<br><small>确保 book.json 文件存在且格式正确</small></div>';
        }
    }

    // ======================== 过滤 ========================
    function getFilteredData(mode, category) {
        if (mode === 'sequential') return bookData;
        return bookData.filter(art => {
            if (!art.category) return false;
            if (SPECIAL_CATEGORIES.includes(art.category)) return false;
            if (category === '全部') return true;
            return art.category === category;
        });
    }

    // ======================== 渲染 ========================
    function renderPage() {
        if (filteredData.length === 0) {
            contentArea.innerHTML = '<div class="loading">📭 当前分类下没有内容</div>';
            progressDisplay.innerText = `0 / 0`;
            pageInfo.innerText = `0 / 0`;
            return;
        }

        if (currentPage < 0) currentPage = 0;
        if (currentPage >= filteredData.length) currentPage = filteredData.length - 1;

        const art = filteredData[currentPage];
        if (!art) return;

        const isSpecial = ['纲领', '开篇', '尾页', '封底'].includes(art.title) || art.title.startsWith('感悟');

        let html = '';

        if (art.category) {
            html += `<div class="content-category">📁 ${art.category}</div>`;
        }

        let titleHtml = `<span class="content-title">${art.title}</span>`;
        if (isSpecial) {
            titleHtml += ` <span class="special-tag">📌 特殊章节</span>`;
        }
        html += titleHtml;

        html += `<div class="content-columns">`;

        html += `<div class="content-column">`;
        html += `<div class="column-label">原 文</div>`;
        if (art.original) {
            html += `<div class="content-original">${art.original}</div>`;
        } else {
            html += `<div class="content-original" style="color:#ccc; font-style:italic;">（无原文）</div>`;
        }
        html += `</div>`;

        html += `<div class="content-column">`;
        html += `<div class="column-label">白 话</div>`;
        if (art.translation) {
            html += `<div class="content-trans">📖 ${art.translation}</div>`;
        } else {
            html += `<div class="content-trans" style="color:#ccc; font-style:italic;">（无白话）</div>`;
        }
        if (art.evaluation) {
            let evalText = art.evaluation;
            evalText = evalText.replace(/。\s*第十三术/g, '。<br>第十三术');
            evalText = evalText.replace(/。\s*第二十九术/g, '。<br>第二十九术');
            html += `<div class="content-eval">✍️ ${evalText}</div>`;
        }
        html += `</div>`;
        html += `</div>`;

        contentArea.innerHTML = html;

        // 滚动到内容顶部（手机上看完一页翻页后，内容从顶部开始）
        contentArea.scrollTop = 0;

        const pageNum = currentPage + 1;
        progressDisplay.innerText = `${pageNum} / ${filteredData.length}`;
        pageInfo.innerText = `${pageNum} / ${filteredData.length}`;

        populateJumpSelect();
        updateButtons();
        updateFooterNav();
    }

    // ======================== 底部导航 ========================
    function renderFooterNav() {
        let html = '';
        if (currentMode === 'sequential') {
            const navItems = [
                { label: '纲领', target: '纲领' },
                { label: '正文', target: '第一术 · 洒扫庭除' },
                { label: '感悟', target: '感悟一' },
                { label: '尾页', target: '尾页' }
            ];
            for (let item of navItems) {
                const idx = filteredData.findIndex(art => art.title === item.target);
                if (idx !== -1) {
                    let isActive = false;
                    if (item.label === '正文') {
                        const firstArtIdx = idx;
                        const lastArtIdx = filteredData.findIndex(art => art.title === '易命最终术');
                        if (currentPage >= firstArtIdx && currentPage <= lastArtIdx) {
                            isActive = true;
                        }
                    } else {
                        isActive = (currentPage === idx);
                    }
                    html += `<a data-index="${idx}" class="${isActive ? 'active-link' : ''}">${item.label}</a>`;
                }
            }
        } else {
            const cats = ['全部', ...CATEGORY_ORDER];
            for (let cat of cats) {
                const isActive = (cat === currentCategory);
                html += `<a data-category="${cat}" class="${isActive ? 'active-link' : ''}">${cat === '全部' ? '📂 全部' : cat}</a>`;
            }
        }
        footerNav.innerHTML = html;

        footerNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function() {
                if (currentMode === 'sequential') {
                    const idx = parseInt(this.dataset.index);
                    if (!isNaN(idx) && idx >= 0 && idx < filteredData.length) {
                        currentPage = idx;
                        renderPage();
                    }
                } else {
                    const cat = this.dataset.category;
                    if (cat) {
                        currentCategory = cat;
                        filteredData = getFilteredData('categorical', currentCategory);
                        currentPage = 0;
                        renderPage();
                        renderFooterNav();
                    }
                }
            });
        });
    }

    function updateFooterNav() {
        const links = footerNav.querySelectorAll('a');
        links.forEach(link => {
            link.classList.remove('active-link');
            if (currentMode === 'sequential') {
                const idx = parseInt(link.dataset.index);
                const label = link.textContent.trim();
                if (label === '正文') {
                    const firstArtIdx = filteredData.findIndex(art => art.title === '第一术 · 洒扫庭除');
                    const lastArtIdx = filteredData.findIndex(art => art.title === '易命最终术');
                    if (currentPage >= firstArtIdx && currentPage <= lastArtIdx) {
                        link.classList.add('active-link');
                    }
                } else {
                    if (!isNaN(idx) && idx === currentPage) {
                        link.classList.add('active-link');
                    }
                }
            } else {
                const cat = link.dataset.category;
                if (cat === currentCategory) {
                    link.classList.add('active-link');
                }
            }
        });
    }

    // ======================== 下拉框 ========================
    function populateJumpSelect() {
        jumpSelect.innerHTML = '';
        filteredData.forEach((art, index) => {
            const option = document.createElement('option');
            option.value = index;
            let displayTitle = art.title;
            if (art.title === '纲领') displayTitle = '📜 纲领';
            else if (art.title === '开篇') displayTitle = '📖 开篇';
            else if (art.title === '尾页') displayTitle = '📌 尾页';
            else if (art.title === '封底') displayTitle = '📌 封底';
            else if (art.title.startsWith('感悟')) {
                const num = art.title.replace('感悟', '');
                displayTitle = `💭 感悟·${num}`;
            }
            option.textContent = `${index + 1}. ${displayTitle}`;
            jumpSelect.appendChild(option);
        });
        if (filteredData.length > 0 && currentPage < filteredData.length) {
            jumpSelect.value = currentPage;
        }
        jumpSelect.onchange = function() {
            const target = parseInt(this.value);
            if (target >= 0 && target < filteredData.length) {
                currentPage = target;
                renderPage();
            }
        };
    }

    // ======================== 翻页 ========================
    function updateButtons() {
        prevBtn.disabled = (currentPage === 0);
        nextBtn.disabled = (currentPage === filteredData.length - 1 || filteredData.length === 0);
    }

    function goPrev() {
        if (currentPage > 0) {
            currentPage--;
            renderPage();
        }
    }

    function goNext() {
        if (currentPage < filteredData.length - 1) {
            currentPage++;
            renderPage();
        }
    }

    // ======================== 模式切换 ========================
    function switchMode(mode) {
        currentMode = mode;
        mainTitle.innerHTML = mode === 'sequential' ? '📖 易命术 · 📜 顺序阅读' : '📖 易命术 · 📂 分类阅读';

        if (mode === 'sequential') {
            filteredData = getFilteredData('sequential', null);
            currentCategory = null;
        } else {
            currentCategory = '全部';
            filteredData = getFilteredData('categorical', currentCategory);
        }

        currentPage = 0;
        renderPage();
        renderFooterNav();
    }

    // ======================== 键盘/触摸 ========================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            goPrev();
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
            e.preventDefault();
            goNext();
        }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    });
    document.addEventListener('touchend', function(e) {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
            if (dx < 0) goNext();
            else goPrev();
        }
    });

    // ======================== 绑定事件 ========================
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    modeToggleBtn.addEventListener('click', function() {
        const newMode = (currentMode === 'sequential') ? 'categorical' : 'sequential';
        switchMode(newMode);
    });

    // ======================== 启动 ========================
    loadBook();
</script>
</body>
</html>

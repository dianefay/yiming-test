<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易命术 · 翻页阅读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0ede7;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .reader-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.08);
            padding: 2rem 2.5rem;
            position: relative;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部栏 */
        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid #ede3d6;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .reader-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #b87c4f;
        }

        .reader-progress {
            font-size: 0.85rem;
            color: #8f7e6b;
            background: #f3ede5;
            padding: 0.2rem 1rem;
            border-radius: 2rem;
        }

        /* 模式切换 */
        .mode-switch {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            margin-bottom: 0.8rem;
        }

        .mode-btn {
            flex: 1;
            padding: 0.4rem 0;
            border: 2px solid #ede3d6;
            border-radius: 2rem;
            background: white;
            font-size: 0.85rem;
            font-weight: 600;
            color: #8f7e6b;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }

        .mode-btn.active {
            border-color: #b87c4f;
            background: #fff6ed;
            color: #b87c4f;
        }

        .mode-btn:hover:not(.active) {
            background: #f3ede5;
        }

        /* 内容区 - 双栏布局 */
        .reader-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0;
        }

        .content-columns {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .content-column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .column-label {
            font-size: 0.7rem;
            color: #aa9f90;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .content-category {
            font-size: 0.8rem;
            color: #b87c4f;
            background: #fff0e6;
            display: inline-block;
            padding: 0.15rem 0.8rem;
            border-radius: 2rem;
            margin-bottom: 0.8rem;
            align-self: flex-start;
        }

        .content-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #b87c4f;
            margin-bottom: 0.6rem;
            line-height: 1.2;
        }

        /* 方案五：原文行楷+加粗，白话圆体 */
        .content-original {
            font-family: '华文行楷', 'STXingkai', '方正行楷', 'KaiTi', cursive;
            font-size: 1.1rem;
            font-weight: bold;
            background: #f9f5ef;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            line-height: 1.8;
            color: #2c2b28;
            border-left: 4px solid #b87c4f;
            flex: 1;
        }

        .content-trans {
            font-family: 'PingFang SC', '微软雅黑', 'Helvetica Neue', sans-serif;
            font-size: 1rem;
            color: #4b3e2e;
            line-height: 1.8;
            flex: 1;
        }

        .content-eval {
            font-family: 'PingFang SC', '微软雅黑', 'Helvetica Neue', sans-serif;
            font-size: 0.9rem;
            color: #b1624b;
            background: #fff0e6;
            padding: 0.4rem 0.8rem;
            border-radius: 0.8rem;
            margin-top: 0.4rem;
            white-space: pre-line;
        }

        .content-type-label {
            font-size: 0.7rem;
            color: #aa9f90;
            margin-top: 0.3rem;
        }

        /* 底部导航 */
        .reader-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #ede3d6;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .footer-nav {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .footer-nav a {
            font-size: 0.85rem;
            color: #8f7e6b;
            text-decoration: none;
            cursor: pointer;
            transition: 0.15s;
            padding: 0.1rem 0.2rem;
            border-bottom: 2px solid transparent;
        }

        .footer-nav a:hover {
            color: #b87c4f;
            border-bottom-color: #b87c4f;
        }

        .footer-nav a.active-link {
            color: #b87c4f;
            border-bottom-color: #b87c4f;
        }

        .jump-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #8f7e6b;
        }

        .jump-control select {
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid #ddd2c4;
            background: white;
            font-size: 0.85rem;
            color: #2c2b28;
            cursor: pointer;
            max-width: 220px;
        }

        .jump-control select:focus {
            outline: none;
            border-color: #b87c4f;
        }

        /* 翻页按钮 */
        .reader-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.8rem;
            gap: 1rem;
        }

        .nav-btn {
            background: #e2d9cf;
            color: #2c2b28;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            min-width: 100px;
        }

        .nav-btn:hover:not(:disabled) {
            background: #d1c5b6;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn-primary {
            background: #b87c4f;
            color: white;
        }

        .nav-btn-primary:hover:not(:disabled) {
            background: #9a623d;
        }

        .nav-center {
            font-size: 0.85rem;
            color: #8f7e6b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: #8f7e6b;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #b87c4f;
        }

        .loading {
            text-align: center;
            padding: 3rem 0;
            color: #8f7e6b;
        }

        /* 移动端适配 */
        @media (max-width: 700px) {
            .reader-container {
                padding: 1.5rem 1.2rem;
                min-height: 80vh;
            }

            .content-columns {
                flex-direction: column;
                gap: 1rem;
            }

            .content-title {
                font-size: 1.3rem;
            }

            .content-original {
                font-size: 1rem;
                padding: 0.6rem 0.8rem;
            }

            .content-trans {
                font-size: 0.9rem;
            }

            .column-label {
                display: none;
            }

            .nav-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
                min-width: 70px;
            }

            .reader-nav {
                flex-wrap: wrap;
                gap: 0.5rem;
                justify-content: center;
            }

            .jump-control select {
                max-width: 160px;
                font-size: 0.75rem;
            }

            .reader-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .footer-nav {
                justify-content: center;
            }

            .jump-control {
                justify-content: center;
            }

            .mode-btn {
                font-size: 0.75rem;
                padding: 0.3rem 0;
            }
        }

        @media (max-width: 400px) {
            .reader-container {
                padding: 1rem 0.8rem;
                border-radius: 1.2rem;
            }

            .content-title {
                font-size: 1.1rem;
            }

            .content-original {
                font-size: 0.9rem;
            }

            .nav-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
                min-width: 60px;
            }

            .jump-control select {
                max-width: 120px;
                font-size: 0.7rem;
            }

            .footer-nav a {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
<div class="reader-container" id="app">
    <div class="reader-header">
        <span class="reader-title">📖 易命术 · 翻页阅读</span>
        <span class="reader-progress" id="progressDisplay">加载中...</span>
    </div>

    <!-- 模式切换 -->
    <div class="mode-switch" id="modeSwitch">
        <button class="mode-btn active" data-mode="sequential">📜 顺序阅读</button>
        <button class="mode-btn" data-mode="categorical">📂 分类阅读</button>
    </div>

    <div class="reader-content" id="contentArea">
        <div class="loading">📚 加载中...</div>
    </div>

    <div class="reader-footer">
        <div class="footer-nav" id="footerNav"></div>
        <div class="jump-control">
            <span>跳转：</span>
            <select id="jumpSelect"></select>
        </div>
    </div>

    <div class="reader-nav">
        <button class="nav-btn" id="prevBtn" disabled>◀ 上一页</button>
        <span class="nav-center" id="pageInfo">—</span>
        <button class="nav-btn nav-btn-primary" id="nextBtn">下一页 ▶</button>
    </div>

    <a href="index.html" class="back-link">🏠 返回主菜单</a>
</div>

<script>
    // ======================== 全局 ========================
    let bookData = [];
    let currentMode = 'sequential';   // 'sequential' | 'categorical'
    let currentCategory = '全部';     // 分类模式下当前选中的分类
    let filteredData = [];
    let currentPage = 0;
    let totalPages = 0;

    // 分类顺序（用于分类阅读模式）
    const CATEGORY_ORDER = ['环境与自律', '言语与社交', '心性与情绪', '处事与决策', '人际与边界', '根基与识己'];

    // 特殊分类（不显示在分类阅读中）
    const SPECIAL_CATEGORIES = ['总纲', '结语', '其他'];

    // 需要过滤掉的条目
    const EXCLUDED_TITLES = ['呜呼·过渡'];

    // DOM 元素
    const contentArea = document.getElementById('contentArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const progressDisplay = document.getElementById('progressDisplay');
    const footerNav = document.getElementById('footerNav');
    const jumpSelect = document.getElementById('jumpSelect');
    const modeSwitch = document.getElementById('modeSwitch');

    // ======================== 数据加载 ========================
    async function loadBook() {
        try {
            const res = await fetch('book.json');
            if (!res.ok) throw new Error('加载 book.json 失败');
            const data = await res.json();
            bookData = data.books.filter(art => !EXCLUDED_TITLES.includes(art.title));
            if (bookData.length === 0) {
                contentArea.innerHTML = '<div class="loading">⚠️ 暂无内容</div>';
                return;
            }
            // 默认顺序模式
            switchMode('sequential');
        } catch (err) {
            console.error(err);
            contentArea.innerHTML = '<div class="loading">⚠️ 数据加载失败，请刷新重试<br><small>确保 book.json 文件存在且格式正确</small></div>';
        }
    }

    // ======================== 过滤数据（分类模式） ========================
    function getFilteredData(mode, category) {
        if (mode === 'sequential') {
            return bookData;
        } else {
            // 分类模式：只显示非特殊分类的条目，且匹配当前分类
            let filtered = bookData.filter(art => {
                if (!art.category) return false;
                if (SPECIAL_CATEGORIES.includes(art.category)) return false;
                if (category === '全部') return true;
                return art.category === category;
            });
            return filtered;
        }
    }

    // ======================== 渲染当前页 ========================
    function renderPage() {
        if (filteredData.length === 0) {
            contentArea.innerHTML = '<div class="loading">📭 当前分类下没有内容</div>';
            progressDisplay.innerText = `0 / 0`;
            pageInfo.innerText = `0 / 0`;
            return;
        }

        if (currentPage < 0) currentPage = 0;
        if (currentPage >= filteredData.length) currentPage = filteredData.length - 1;

        const art = filteredData[currentPage];
        if (!art) return;

        const isSpecial = ['纲领', '开篇', '尾页', '封底'].includes(art.title) || art.title.startsWith('感悟');

        let html = '';

        // 分类标签
        if (art.category) {
            html += `<div class="content-category">📁 ${art.category}</div>`;
        }

        html += `<div class="content-title">${art.title}</div>`;
        html += `<div class="content-columns">`;

        // 左栏：原文
        html += `<div class="content-column">`;
        html += `<div class="column-label">原 文</div>`;
        if (art.original) {
            html += `<div class="content-original">${art.original}</div>`;
        } else {
            html += `<div class="content-original" style="color:#ccc; font-style:italic;">（无原文）</div>`;
        }
        html += `</div>`;

        // 右栏：白话 + 评价
        html += `<div class="content-column">`;
        html += `<div class="column-label">白 话</div>`;
        if (art.translation) {
            html += `<div class="content-trans">📖 ${art.translation}</div>`;
        } else {
            html += `<div class="content-trans" style="color:#ccc; font-style:italic;">（无白话）</div>`;
        }
        if (art.evaluation) {
            let evalText = art.evaluation;
            evalText = evalText.replace(/。\s*第十三术/g, '。<br>第十三术');
            evalText = evalText.replace(/。\s*第二十九术/g, '。<br>第二十九术');
            html += `<div class="content-eval">✍️ ${evalText}</div>`;
        }
        html += `</div>`;
        html += `</div>`;

        if (isSpecial) {
            html += `<div class="content-type-label">📌 特殊章节</div>`;
        }

        contentArea.innerHTML = html;

        // 更新页码
        const pageNum = currentPage + 1;
        progressDisplay.innerText = `${pageNum} / ${filteredData.length}`;
        pageInfo.innerText = `${pageNum} / ${filteredData.length}`;

        // 更新下拉框
        populateJumpSelect();

        // 更新导航按钮
        updateButtons();

        // 更新底部导航高亮
        updateFooterNav();
    }

    // ======================== 底部导航 ========================
    function renderFooterNav() {
        let html = '';
        if (currentMode === 'sequential') {
            // 顺序模式：正文 · 感悟 · 尾页
            const navItems = [
                { label: '正文', target: '第一术' },
                { label: '感悟', target: '感悟一' },
                { label: '尾页', target: '尾页' }
            ];
            for (let item of navItems) {
                const idx = filteredData.findIndex(art => art.title === item.target);
                if (idx !== -1) {
                    html += `<a data-index="${idx}" class="${currentPage === idx ? 'active-link' : ''}">${item.label}</a>`;
                }
            }
        } else {
            // 分类模式：六个分类 + "全部"
            const cats = ['全部', ...CATEGORY_ORDER];
            for (let cat of cats) {
                const isActive = (cat === currentCategory);
                html += `<a data-category="${cat}" class="${isActive ? 'active-link' : ''}">${cat === '全部' ? '📂 全部' : cat}</a>`;
            }
        }
        footerNav.innerHTML = html;

        // 绑定事件
        footerNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function() {
                if (currentMode === 'sequential') {
                    const idx = parseInt(this.dataset.index);
                    if (!isNaN(idx) && idx >= 0 && idx < filteredData.length) {
                        currentPage = idx;
                        renderPage();
                    }
                } else {
                    const cat = this.dataset.category;
                    if (cat) {
                        currentCategory = cat;
                        filteredData = getFilteredData('categorical', currentCategory);
                        currentPage = 0;
                        renderPage();
                        // 重新渲染底部导航以更新高亮
                        renderFooterNav();
                    }
                }
            });
        });
    }

    function updateFooterNav() {
        // 简单刷新底部导航高亮
        const links = footerNav.querySelectorAll('a');
        links.forEach(link => {
            link.classList.remove('active-link');
            if (currentMode === 'sequential') {
                const idx = parseInt(link.dataset.index);
                if (!isNaN(idx) && idx === currentPage) {
                    link.classList.add('active-link');
                }
            } else {
                const cat = link.dataset.category;
                if (cat === currentCategory) {
                    link.classList.add('active-link');
                }
            }
        });
    }

    // ======================== 下拉框 ========================
    function populateJumpSelect() {
        jumpSelect.innerHTML = '';
        filteredData.forEach((art, index) => {
            const option = document.createElement('option');
            option.value = index;
            let displayTitle = art.title;
            if (art.title === '纲领') displayTitle = '📜 纲领';
            else if (art.title === '开篇') displayTitle = '📖 开篇';
            else if (art.title === '尾页') displayTitle = '📌 尾页';
            else if (art.title === '封底') displayTitle = '📌 封底';
            else if (art.title.startsWith('感悟')) {
                const num = art.title.replace('感悟', '');
                displayTitle = `💭 感悟·${num}`;
            }
            option.textContent = `${index + 1}. ${displayTitle}`;
            jumpSelect.appendChild(option);
        });
        if (filteredData.length > 0 && currentPage < filteredData.length) {
            jumpSelect.value = currentPage;
        }
        // 绑定跳转事件
        jumpSelect.onchange = function() {
            const target = parseInt(this.value);
            if (target >= 0 && target < filteredData.length) {
                currentPage = target;
                renderPage();
                document.querySelector('.reader-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };
    }

    // ======================== 翻页 ========================
    function updateButtons() {
        prevBtn.disabled = (currentPage === 0);
        nextBtn.disabled = (currentPage === filteredData.length - 1 || filteredData.length === 0);
    }

    function goPrev() {
        if (currentPage > 0) {
            currentPage--;
            renderPage();
        }
    }

    function goNext() {
        if (currentPage < filteredData.length - 1) {
            currentPage++;
            renderPage();
        }
    }

    // ======================== 模式切换 ========================
    function switchMode(mode) {
        currentMode = mode;
        // 更新按钮状态
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });

        if (mode === 'sequential') {
            filteredData = getFilteredData('sequential', null);
            currentCategory = null;
        } else {
            // 分类模式默认"全部"
            currentCategory = '全部';
            filteredData = getFilteredData('categorical', currentCategory);
        }

        currentPage = 0;
        renderPage();
        renderFooterNav();
        // 重新渲染底部导航（因为模式变了，导航项不同）
        // renderFooterNav 已经在 renderPage 中调用 updateFooterNav，但需要重建
        // 重新调用 renderFooterNav 会重建 DOM，所以先清除再重建
        footerNav.innerHTML = '';
        renderFooterNav();
    }

    // ======================== 键盘和触摸支持 ========================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            goPrev();
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
            e.preventDefault();
            goNext();
        }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    });
    document.addEventListener('touchend', function(e) {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
            if (dx < 0) goNext();
            else goPrev();
        }
    });

    // ======================== 绑定事件 ========================
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    modeSwitch.addEventListener('click', function(e) {
        const btn = e.target.closest('.mode-btn');
        if (btn && btn.dataset.mode !== currentMode) {
            switchMode(btn.dataset.mode);
        }
    });

    // ======================== 启动 ========================
    loadBook();
</script>
</body>
</html>

        { "id": 121, "text": "我会为了练好一个技能，连续几小时不碰手机。", "aspect": "focus" },
        { "id": 122, "text": "我宁愿多花时间走正规流程，也不托关系走捷径。", "aspect": "shortcut" },

        { "id": 124, "text": "即使新工作机会很诱人，我也不会轻易放弃自己积累多年的专业。", "aspect": "root" },
        { "id": 125, "text": "我会通过观察一个人如何对待服务人员来判断他的品行。", "aspect": "discern" },

        { "id": 129, "text": "别人无意中说错话冒犯我，我很少记仇。", "aspect": "tolerance" },

        { "id": 132, "text": "我害怕的事情（如公开演讲、高空），反而会主动去尝试。", "aspect": "fear" },
        { "id": 133, "text": "倒霉的时候，我很少向别人诉苦。", "aspect": "selfpity" },
        { "id": 134, "text": "我能和不同年龄、职位的人自然聊天，不分高低。", "aspect": "social" },
        { "id": 135, "text": "为了重要的目标，我愿意投入大部分积蓄和精力。", "aspect": "allin" },
        { "id": 136, "text": "别人在背后怎么评价我，我不会太在意。", "aspect": "outsider" },
        { "id": 137, "text": "我吃饭会光盘，不会剩下饭菜。", "aspect": "waste" },
        { "id": 138, "text": "我做事很少赶时间，喜欢从容不迫。", "aspect": "rush" },
        { "id": 139, "text": "我不会为了面子而夸大自己认识谁。", "aspect": "vanity" },
        { "id": 140, "text": "我选择工作或生活方式时，优先考虑自己是否安心，而不是别人怎么看。", "aspect": "ease" },

        { "id": 143, "text": "看到别人拥有我没有的东西，我不会嫉妒。", "aspect": "content" },
        { "id": 144, "text": "我很清楚自己的优点和缺点，不容易被外界评价带偏。", "aspect": "selfknow" },
        { "id": 145, "text": "我相信运气不好时，只要更努力就能改变。", "aspect": "agency" },
        { "id": 146, "text": "我会定期清理不再用的物品，捐赠或转卖，而不是直接扔掉。", "aspect": "waste" },
        { "id": 147, "text": "开会或上课时，我不会同时刷手机处理其他事。", "aspect": "focus" },
        { "id": 148, "text": "我不会因为朋友说“这个很划算”就跟着一起买。", "aspect": "impulse" },
        { "id": 149, "text": "即使心情不好，我也不会在社交媒体上发泄。", "aspect": "speech" },
        { "id": 150, "text": "我每天睡觉和起床的时间误差不超过一小时。", "aspect": "routine" },
        { "id": 151, "text": "我讨厌攀附权贵，靠实力说话。", "aspect": "vanity" },
        { "id": 152, "text": "失败后我会写复盘笔记，分析自己哪些决策错了。", "aspect": "introspect" },
        { "id": 153, "text": "我不会因为对方是领导就刻意讨好或畏缩。", "aspect": "social" },
        { "id": 154, "text": "我可以一个人待着也很自在，不依赖他人陪伴。", "aspect": "ease" },
        { "id": 155, "text": "我相信命运大部分可以由自己创造。", "aspect": "agency" },
        { "id": 156, "text": "我很少羡慕别人的生活，觉得自己拥有的已经很好。", "aspect": "content" },
        { "id": 157, "text": "当别人要求我帮忙做超出我能力的事，我会明确说“不行”。", "aspect": "boundary" },

        { "id": 159, "text": "我会把闲置物品送给需要的人，而不是堆在角落。", "aspect": "waste" },
        { "id": 160, "text": "我很少因为别人说“你应该怎样”而改变自己的计划。", "aspect": "outsider" },
        { "id": 161, "text": "我能在压力下保持冷静，不慌乱。", "aspect": "anger" },
        { "id": 162, "text": "我习惯提前完成工作，不拖到最后一刻。", "aspect": "rush" },
        { "id": 163, "text": "我敢于承认自己的错误，并向对方道歉。", "aspect": "introspect" },
        { "id": 164, "text": "我清楚自己适合什么样的伴侣和工作环境。", "aspect": "selfknow" },
        { "id": 165, "text": "我不会因为一次失败就否定自己。", "aspect": "selfpity" },

    const BOOK_DATA = [
        { "title": "第一术 · 洒扫庭除", "original": "洒扫庭除，使身不近秽；肃洁仪容，使秽不附身。勿卧于污秽熏天、杂然无序之所，勿寝于阴暗潮湿之地。", "translation": "打扫环境、整洁自身，污秽不近则气运清明。干净是运气的第一道门槛。", "evaluation": "" },
        { "title": "第二术 · 应时作息", "original": "应时而兴，应时而食，应时而作，应时而息。四时有序，心神乃一。", "translation": "规律作息让心神安宁，心神宁则气运聚。", "evaluation": "" },
        { "title": "第三术 · 语善而真", "original": "言讷而实，语善而真。不泄恶语，不传妄言，不涉谤讥。君子之运，发于唇齿。", "translation": "真诚善良的言语是福气开关，妄言恶语会驱散好运。", "evaluation": "" },
        { "title": "第四术 · 戒贪知止", "original": "以见利之明处世，财可求也。以侵害之心得财，悖逆天道，必遭反报：非数倍偿赎，即气运消减，身心俱伤。", "translation": "不贪非分之物，不侵害他人。若以恶求财，必数倍偿还。", "evaluation": "道德层面得到报应，而非玄学。" },
        { "title": "第五术 · 逐一面之", "original": "旧过过，未未到。事有先后，逐一面之，戒之在贪。", "translation": "一次只专注一件事。贪多求快会消耗品质。", "evaluation": "" },
        { "title": "第六术 · 不趋捷径", "original": "今人多趋捷径，然未察其径塞途拥，而康庄之衢，阒其无人。若行事觉轻安自得者，此即汝之坦途也。", "translation": "捷径拥挤易翻车，踏实大道虽慢必达。", "evaluation": "" },
        { "title": "第六术 · 顺势待时", "original": "天时至，气运生，体察而顺应之。若能与道偕行，则如顺水行舟，无往不利。", "translation": "等待时机，顺势而为，不逆流死磕。", "evaluation": "" },
        { "title": "第八术 · 旧业勿弃", "original": "业之道，旧业勿轻弃。虽利薄，然根基之所系，存身之本也。若新业既成，根基稳固，方可择之而从。若二者得兼，善之善者也。", "translation": "不要轻易抛弃积累了多年的技能或人脉，它们是低谷时的救命稻草。", "evaluation": "" },
        { "title": "第九术 · 识人避害", "original": "初遇生人，若生厌憎，心神不安，速避之。见使君怡然者，可近而交，然须慎察其行。必试其信义，此乃立世之本。若察其信劣，急避如避刃矢。", "translation": "相信直觉，让不舒服的人远离。日久见人心。", "evaluation": "先保持距离，多观察几次再决定！" },
        { "title": "第十术 · 贵人流转", "original": "父母者，天授贵人也；困厄中施以援手者，贵人也；指迷津于惘途者，贵人也；甘苦与共之友，贵人也；生死相托之夫妻，互为贵人也。然贵人非固守一世，乃如云水流转不息。当明眸察周遭之贵气，承其瑞意，则如握机缘之枢机。", "translation": "贵人并非固定，善待身边人，自己亦做他人贵人。", "evaluation": "" },
        { "title": "第十一术 · 慎言未成", "original": "吾观处世之道，事未成勿泄于未预者，利既获勿宣于不知者。倘炫其功，恐招非议而损其益。", "translation": "事情没成之前不要张扬，成功后更别炫耀。", "evaluation": "" },
        { "title": "第十二术 · 竭诚以赴", "original": "凡所当为之事，必竭诚以赴，务尽其能。若存苟且之心，或怀怠惰之意，敷衍塞责，则不如止而不为。盖草率而成者，恐招无妄之灾，遗患无穷，终损己身之气运。故知止不为，亦明哲之道也。", "translation": "该做的事全力以赴，不想做就不要做，最忌半吊子。", "evaluation": "" },
        { "title": "第十三术 · 涤尽浮光", "original": "识人者，当涤尽浮光，弃置衔冕，略其形骸，屏绝人议。惟观其言行之微，察其举止之细，则彼若素缣一卷，自将仁善鄙诈，贞邪曲直，书而示汝矣。", "translation": "抛开头衔外貌，只看细节言行，才能看清一个人。", "evaluation": "" },
        { "title": "第十四术 · 御人以疑", "original": "御人当以疑始，必待其事毕。绳可束其身，岂能羁其志？人为灵长，旦暮异焉，唯以疑目察之，乃见其纤隐之变。", "translation": "管理或合作时保持审慎，结果出来后再下判断。", "evaluation": "" },
        { "title": "第十五术 · 判事三境", "original": "判事之成否，其下者取利，其次者取鉴，其至者观乎气运之蓄。", "translation": "低阶看利益，中阶学经验，高阶洞察大势积蓄。", "evaluation": "" },
        { "title": "第十六术 · 三等交游", "original": "交游之众，当分三等：其一唯利是图，毋涉情义；其二唯情是守，毋涉利欲；其三情利皆可谋。得此辈愈众，则气运愈昌。", "translation": "分清楚谁谈利益谁谈感情，情利双收之人是贵人。", "evaluation": "" },
        { "title": "第十七术 · 乘势不骄", "original": "方时运至际，万象皆佐。所当为者，惟体察而顺应之，乘势而起。然骄矜造作，挥霍无度，实悖逆福运。慎之。", "translation": "顺境不飘，骄傲会作没运气。", "evaluation": "" },
        { "title": "第十八术 · 共事忘私", "original": "共事欲成，首在谋宜而见远，次在尽其才，至要者忘私。三者备，则事可成其八九。余者，顺天时而已。", "translation": "忘掉私心，团队才能成就你。", "evaluation": "" },
        { "title": "第十九术 · 试诚交友", "original": "观一人，细察之，见其品性端良，乃欲与之交。可试询其隐衷，若其诚言不讳，则证其心已视尔为友矣。", "translation": "愿意向你坦诚内心的人，才把你当朋友。", "evaluation": "分天生嘴不严和慢热谨慎" },
        { "title": "第二十术 · 自疏者福", "original": "逢困厄而能自疏者，有福之人也；临险阻犹可坦然而笑者，具大运之相也。", "translation": "能自我开解困境，遇险依然微笑，是有大福之人。", "evaluation": "" },
        { "title": "第二十一术 · 众悦险伏", "original": "众悦者，气运亨也，然险亦伏于侧矣。", "translation": "被众人喜欢时要警惕危险潜伏。", "evaluation": "" },
        { "title": "第二十二术 · 夫妇同心", "original": "夫妇之道，首以信为万事之基，次则消弭龃龉，复可截长续短，尤贵同心以御外。如此，则贵人之气可臻其极，偕老之道得以久长。", "translation": "信任、消磨矛盾、共同对外，可臻极运。", "evaluation": "" },
        { "title": "第二十三术 · 勿假其名", "original": "勿以交贵者为荣，勿假其名以自壮。若此，是转时运于人，而己之气数益损矣。", "translation": "借他人光环虚荣，等于拱手让运。", "evaluation": "可以提，别全靠；可以借，别攀附。" },
        { "title": "第二十四术 · 平等相对", "original": "欲得言谈之真味，必以平等相对。至亲犹然。倘彼执守尊卑之见，则所对无非虚文俗套耳。", "translation": "放下尊卑，才能得到真心交流。", "evaluation": "" },
        { "title": "第二十五术 · 孤注之志", "original": "出资市金，逐盐铁之利者，如博戏，肇端当有尽付一掷之志。所谓必成者，诈也。至若合营之事，尤为险途。", "translation": "投资要有全部亏光的觉悟，说必成的都是骗子。", "evaluation": "" },
        { "title": "第二十六术 · 善用财者", "original": "善用财者，不啻重于善牟利者也。不擅牟利，乞食而已；苟不谙用财之道，或致身困，乃至罹祸倾覆。", "translation": "会花钱比会赚钱更重要。", "evaluation": "" },
        { "title": "第二十七术 · 勿强险事", "original": "勿强求险巇之事以耽危殆之娱，如此则大伤气运。向者无恙，惟气运未尽耳。", "translation": "不要为了刺激去作死，没出事只是运气还没用完。", "evaluation": "可以为了志向去冒险，但不要为了娱乐去冒险。" },
        { "title": "第二十八术 · 内心无樊", "original": "勿自贻伊戚，凡桎梏皆厄气运。外锢虽不可御，内心毋复筑樊牢。", "translation": "外界的枷锁躲不开，但不要在心里再修一个牢笼。", "evaluation": "" },
        { "title": "第二十九术 · 赏物勿溺", "original": "鉴物犹鉴人，辨其质，可赏而勿溺；溺则神气为所夺。", "translation": "可以欣赏美好的东西，沉迷会被吸走精气神。", "evaluation": "" },
        { "title": "第三十术 · 绝不可费", "original": "用度可奢，然绝不可费。费者，若财货食粮；究其本，费运气也。", "translation": "浪费任何物品都是在消耗自己的气运。", "evaluation": "" },
        { "title": "第三十一术 · 勿急戒躁", "original": "勿急，心躁易失。盖急与运之频不相合也。", "translation": "急躁和运气的频率相冲，慢下来才能接住好运。", "evaluation": "" },
        { "title": "第三十二术 · 勿占人便", "original": "勿占人财利之便，占其便则遗运于人；不患人取财利之便，取其便则遗运于己。", "translation": "占了别人的便宜，会把自己的运送给对方。", "evaluation": "" },
        { "title": "第三十三术 · 慎用己财", "original": "必费己财；未入囊者，非己有也。若不得已而假人之财，须报之以利。慎勿假占不偿，恐运尽而祸至。", "translation": "花自己的钱，借钱要给利息，赖账会招灾。", "evaluation": "" },
        { "title": "第三十四术 · 怒则智散", "original": "怒则智散，亦损气数。", "translation": "发火时智商归零，运气也跑掉。", "evaluation": "" },
        { "title": "第三十五术 · 避而俟之", "original": "遇不可解之事，避而俟之，或乃上策；强为之者，多反受其咎。", "translation": "解决不了就先放下，硬刚反而受害。", "evaluation": "如果事态恶化，则另寻他法，避非唯一解。" },
        { "title": "第三十六术 · 正对内惧", "original": "正对内惧，乃得天眷。", "translation": "直面恐惧，上天才会眷顾你。", "evaluation": "" },
        { "title": "第三十七术 · 勿自怜", "original": "勿自怜，时运亦厌之。", "translation": "别自己可怜自己，好运最讨厌自怜的人。", "evaluation": "" },
        { "title": "第三十八术 · 百计图出", "original": "坠于深壑；偃卧无为，常也；百计图出，乃大运之兆。", "translation": "躺平等死是常态，拼命挣扎才是大运的前兆。", "evaluation": "" },
        { "title": "第三十九术 · 念有非无", "original": "计其所有而不念所无者，斯为吉人之兆也。", "translation": "数自己有的，不惦记没有的，是有福之人。", "evaluation": "" },
        { "title": "第四十术 · 灵根身树", "original": "灵若根，身若树，运若叶。叶虽凋落，苟灵不死、身不枯，逢其时，终见枝繁叶茂。", "translation": "根没烂，树干没空，叶子总会再长出来。", "evaluation": "" },
        { "title": "第四十一术 · 豁尽所有", "original": "豁尽所有乃制胜之枢，面厚如革实为初基。事成则万口争颂，功败则形迹俱冥。故无须怀讥诮之虞于方寸，洞明此理者，天岂肯薄待之？昔有破釜沉舟之志，而世惟传奏凯之歌，谁见折戟沉沙之迹？诚能心无滞碍，行不疑迟，既悟玄机，气运自随。", "translation": "豁出去，是赢的关键。脸皮厚，是起步的门槛。赢了，万人颂；输了，无人提。敢梭哈，能接受满盘皆输，运气反而跟着你。", "evaluation": "能接受满盘皆输，就豁出去。" },
        { "title": "第四十二术 · 务修者成", "original": "逐成者，众庶之所趋；务修者，达人之所怀。怀修之人，是谓成矣。", "translation": "追求外面的成就谁都行，内修的人才是真成就。", "evaluation": "" },
        { "title": "第四十三术 · 善待左右", "original": "不图报而善待左右，乃汝之福也。", "translation": "对身边人好不求回报，本身就是福气。", "evaluation": "" },
        { "title": "第四十四术 · 逢凶化吉", "original": "逢凶时，当先谋化吉之道。", "translation": "遇到坏事先想怎么把它变成好事。", "evaluation": "" },
        { "title": "第四十五术 · 绝期于人", "original": "绝期于人，得之鸿运。", "translation": "不把全部期望压在一个人身上，鸿运自来。", "evaluation": "不是不能有任何期望，而是不要把全部期望压在一个人身上。" },
        { "title": "第四十六术 · 能宽则宽", "original": "能宽则宽，盖宽乃居高临下之态也。", "translation": "宽容是强者的姿态。", "evaluation": "" },
        { "title": "第四十七术 · 识己", "original": "识人、识物、识己，其道一也。", "translation": "看清自己和看透事物是同一套功夫。", "evaluation": "第十三术（识人）：涤尽浮光，弃置衔冕，略其形骸，屏绝人议。惟观其言行之微，察其举止之细。第二十九术（鉴物）：鉴物犹鉴人，辨其质，可赏而勿溺。" },
        { "title": "第四十八术 · 容受御运", "original": "容受万事，御运在己。洞明造化，即得真运。", "translation": "接受一切发生，命运在你手里。", "evaluation": "" },
        { "title": "第四十九术 · 讼过内省", "original": "事之不成，必在己也。讼过而内省，克己而复正。", "translation": "失败时先找自己的原因，从自身破局。", "evaluation": "客观的改变不了，从自身出发破局，拿回主动权。" },
        { "title": "第五十术 · 众口非我", "original": "众口之我，本非真我；性在方寸，不系唇舌。明其性、顺其道，则大运已在焉。", "translation": "别人嘴里的你不是真的你。把本性认清楚了，顺着该走的路去走，大运就已经在你身上了。", "evaluation": "别人眼中的你，有一部分是真的你，有一部分是你给别人看到的你。择其善者而从之，其不善者而弃之。" },
        { "title": "第五十一术 · 无待常适", "original": "无待而常适者，天之所厚，亦至运也。", "translation": "不靠外界条件也能自在的人，是天选之子。", "evaluation": "大部分人都是「有待而常适」，这是人类的出厂设置。此乃果，源于五十二术之内观。" },
        { "title": "第五十二术 · 观心察念", "original": "观喜怒于己身，察起心动念，此乃运中之至运也。", "translation": "观察自己的喜怒哀乐，觉察念头如何生灭，这是好运中最好的运气。", "evaluation": "此乃因。能观己之喜怒、察起心动念，方为修运之根本。第五十一术“无待而常适”是其果——因上着力，果上随缘。" }
    ];

    // ----------------------------- 页面逻辑（与原版相同） -----------------------------
    let fullQuestionBank = FULL_QUESTION_BANK;
    let bookData = BOOK_DATA;
    let currentQuestions = [];
    let currentAnswers = [];
    let pageSize = 5;
    let currentPage = 0;
    let totalPages = 0;

    // DOM 元素
    const modeSelector = document.getElementById('modeSelector');
    const bookView = document.getElementById('bookView');
    const testView = document.getElementById('testView');
    const questionsPageDiv = document.getElementById('questionsPage');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const resetTestBtn = document.getElementById('resetTestBtn');
    const pageInfoSpan = document.getElementById('pageInfo');
    const totalProgressSpan = document.getElementById('totalProgress');
    const totalNeededSpan = document.getElementById('totalNeeded');
    const progressFill = document.getElementById('progressFill');
    const resultArea = document.getElementById('resultArea');

    // 分类映射
    const categoryMap = {
        "环境与自律": ["env", "routine", "waste", "rush"],
        "言语与社交": ["speech", "social", "outsider", "vanity"],
        "心性与情绪": ["anger", "selfpity", "fear", "content", "tolerance"],
        "处事与决策": ["focus", "shortcut", "timing", "avoid", "allin", "agency", "introspect"],
        "人际与边界": ["discern", "coop", "humility", "boundary", "money"],
        "根基与识己": ["root", "selfknow", "ease", "impulse"]
    };
    const aspectDisplayName = {
        env: "环境整洁", routine: "规律作息", waste: "珍惜物资", rush: "从容不迫",
        speech: "言语真诚", social: "平等社交", outsider: "不在意评价", vanity: "不慕虚名",
        anger: "情绪稳定", selfpity: "不自怜", fear: "直面恐惧", content: "知足常乐", tolerance: "宽容",
        focus: "专注一事", shortcut: "不趋捷径", timing: "顺势待时", avoid: "避而俟之", allin: "豁得出去", agency: "主动掌运", introspect: "内省复盘",
        discern: "识人避害", coop: "团队忘私", humility: "谦虚", boundary: "守住边界", money: "财务谨慎",
        root: "守旧根基", selfknow: "自知之明", ease: "内心安宁", impulse: "克制冲动"
    };

    function updateProgress() {
        const answered = currentAnswers.filter(v => v !== null).length;
        totalProgressSpan.innerText = answered;
        const percent = (answered / currentQuestions.length) * 100;
        progressFill.style.width = percent + '%';
    }

    function isCurrentPageComplete() {
        const start = currentPage * pageSize;
        const end = Math.min(start + pageSize, currentQuestions.length);
        for (let i = start; i < end; i++) {
            if (currentAnswers[i] === null) return false;
        }
        return true;
    }

    function renderCurrentPage() {
        const start = currentPage * pageSize;
        const end = Math.min(start + pageSize, currentQuestions.length);
        let html = '';
        for (let i = start; i < end; i++) {
            const q = currentQuestions[i];
            const val = currentAnswers[i];
            html += `
                <div class="question-card" data-qidx="${i}">
                    <div class="q-text">${i+1}. ${q.text}</div>
                    <div class="options">
                        ${[5,4,3,2,1].map(v => `
                            <div class="opt ${val === v ? 'selected' : ''}" data-val="${v}">
                                ${v}<span>${v===5?'非常符合':v===4?'比较符合':v===3?'一般':v===2?'不太符合':'完全不符'}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        questionsPageDiv.innerHTML = html;

        document.querySelectorAll('.question-card').forEach(card => {
            const qidx = parseInt(card.dataset.qidx);
            card.querySelectorAll('.opt').forEach(opt => {
                opt.addEventListener('click', () => {
                    const val = parseInt(opt.dataset.val);
                    currentAnswers[qidx] = val;
                    card.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    updateProgress();
                    updateNavButtons();
                });
            });
        });

        pageInfoSpan.innerText = `第${currentPage+1}页 / 共${totalPages}页`;
        updateProgress();
        updateNavButtons();
    }

    function updateNavButtons() {
        prevBtn.disabled = (currentPage === 0);
        if (currentPage === totalPages - 1) {
            const allDone = currentAnswers.every(v => v !== null);
            if (allDone) {
                nextBtn.innerText = '✅ 完成测试';
                nextBtn.disabled = false;
            } else {
                nextBtn.innerText = '完成测试';
                nextBtn.disabled = true;
            }
        } else {
            nextBtn.innerText = '下一页 ▶';
            nextBtn.disabled = !isCurrentPageComplete();
        }
    }

    function goPrevPage() {
        if (currentPage > 0) {
            currentPage--;
            renderCurrentPage();
        }
    }

    function goNextPage() {
        if (currentPage === totalPages - 1) {
            if (currentAnswers.every(v => v !== null)) computeAndShowResult();
            return;
        }
        if (isCurrentPageComplete() && currentPage < totalPages - 1) {
            currentPage++;
            renderCurrentPage();
        }
    }

    function getPersonalityType(aspectScoresMap) {
        let results = [];
        for (let [asp, data] of aspectScoresMap.entries()) {
            results.push({ aspect: asp, avg: data.total / data.count });
        }
        results.sort((a,b) => b.avg - a.avg);
        const top3 = results.slice(0,3).map(r => r.aspect);
        const bottom3 = results.slice(-3).map(r => r.aspect);
        
        if (top3.includes("introspect") && top3.includes("selfknow")) {
            return { name: "明心见性者", desc: "你善于内省，对自己有清晰认知，不易被外界带偏。这是修运的深厚根基，但需注意避免过度自省导致行动迟缓。" };
        } else if (top3.includes("allin") || top3.includes("agency")) {
            return { name: "破局开拓者", desc: "你敢于豁出去，相信命运在自己手中。行动力强，但需注意“避而俟之”的智慧，有时等待比硬冲更重要。" };
        } else if (top3.includes("social") && top3.includes("tolerance")) {
            return { name: "广结善缘者", desc: "你与人相处平等宽容，易得贵人相助。但需注意守住边界，避免过度忍让消耗自己。" };
        } else if (bottom3.includes("waste") || bottom3.includes("money")) {
            return { name: "散财待聚型", desc: "你在财务和资源管理上尚有缝隙，气运易从浪费中漏失。调整消费习惯后，运势会有明显提升。" };
        } else if (bottom3.includes("rush") || bottom3.includes("anger")) {
            return { name: "火急火燎型", desc: "你容易急躁或发火，这会扰乱心智和运气。学会慢下来、深呼吸，机会自会浮现。" };
        } else {
            return { name: "中正平和者", desc: "你各方面较为均衡，无明显短板。继续在“识己”和“内省”上深耕，可臻上乘。" };
        }
    }

    function computeAndShowResult() {
        let aspectScores = new Map();
        for (let i=0; i<currentQuestions.length; i++) {
            const asp = currentQuestions[i].aspect;
            const score = currentAnswers[i];
            if (!aspectScores.has(asp)) aspectScores.set(asp, { total:0, count:0 });
            let obj = aspectScores.get(asp);
            obj.total += score;
            obj.count++;
        }
        let allAspectAvg = [];
        for (let [asp, data] of aspectScores.entries()) {
            allAspectAvg.push({ aspect: asp, avg: data.total/data.count });
        }
        const personality = getPersonalityType(aspectScores);
        
        let html = `<div style="font-size:1.3rem; font-weight:600;">🧭 命术镜鉴</div>`;
        html += `<div class="type-badge">🏷️ 你的命术类型：${personality.name}</div>`;
        html += `<p style="margin-bottom:1rem;">${personality.desc}</p>`;
        
        for (let [catName, aspectList] of Object.entries(categoryMap)) {
            const existing = allAspectAvg.filter(a => aspectList.includes(a.aspect));
            if (existing.length === 0) continue;
            existing.sort((a,b) => b.avg - a.avg);
            const best = existing[0];
            const worst = existing[existing.length-1];
            html += `<div class="category-section">
                        <div class="category-title">📁 ${catName}</div>
                        <div class="good-bad-row">
                            <div class="good-item">
                                <strong>✓ 长处</strong><br>
                                ${aspectDisplayName[best.aspect] || best.aspect} (${best.avg.toFixed(1)}分)
                            </div>
                            <div class="bad-item">
                                <strong>⚠️ 可修</strong><br>
                                ${aspectDisplayName[worst.aspect] || worst.aspect} (${worst.avg.toFixed(1)}分)
                            </div>
                        </div>
                        <div class="small-note">该分类下其他维度处于中间状态，可参考命书精进。</div>
                    </div>`;
        }
        
        let strongAspects = allAspectAvg.filter(a => a.avg >= 4.0).map(a => aspectDisplayName[a.aspect] || a.aspect);
        let weakAspects = allAspectAvg.filter(a => a.avg <= 2.5).map(a => aspectDisplayName[a.aspect] || a.aspect);
        let advice = `你的气运根基稳固于「${strongAspects.slice(0,3).join('、') || '多个方面'}」，而「${weakAspects.slice(0,3).join('、') || '少数方面'}」是需要留意的缝隙。建议重点阅读命书中相关条目，并在日常生活中多加觉察。`;
        
        html += `<div class="summary-box"><strong>📖 综合箴言</strong><br>${advice}</div>`;
        html += `<button id="backToModeBtn" class="secondary" style="margin-top:1rem;">🏠 返回模式选择</button>`;
        resultArea.innerHTML = html;
        resultArea.classList.remove('hidden');
        testView.classList.add('hidden');
        document.getElementById('backToModeBtn')?.addEventListener('click', () => {
            resultArea.classList.add('hidden');
            modeSelector.style.display = 'flex';
            testView.classList.add('hidden');
            bookView.classList.add('hidden');
        });
    }

    function startTest(mode) {
        if (mode === 'rapid') {
            const shuffled = [...fullQuestionBank];
            for (let i=shuffled.length-1; i>0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            currentQuestions = shuffled.slice(0, 40);
        } else {
            currentQuestions = [...fullQuestionBank];
        }
        currentAnswers = new Array(currentQuestions.length).fill(null);
        totalPages = Math.ceil(currentQuestions.length / pageSize);
        currentPage = 0;
        modeSelector.style.display = 'none';
        testView.classList.remove('hidden');
        bookView.classList.add('hidden');
        resultArea.classList.add('hidden');
        totalNeededSpan.innerText = currentQuestions.length;
        renderCurrentPage();
    }

    function showBookView() {
        modeSelector.style.display = 'none';
        testView.classList.add('hidden');
        bookView.classList.remove('hidden');
        resultArea.classList.add('hidden');
        let html = '';
        for (let art of bookData) {
            html += `<div class="art-item">
                        <div class="art-title">${art.title}</div>
                        <div class="art-original">${art.original}</div>
                        <div class="art-trans">📖 ${art.translation}</div>`;
            if (art.evaluation) html += `<div class="art-eval">✍️ ${art.evaluation}</div>`;
            html += `</div>`;
        }
        bookView.innerHTML = html;
    }

    function resetToModeSelect() {
        modeSelector.style.display = 'flex';
        testView.classList.add('hidden');
        bookView.classList.add('hidden');
        resultArea.classList.add('hidden');
    }

    // 绑定模式卡片事件
    document.querySelectorAll('.mode-card').forEach(card => {
        card.addEventListener('click', () => {
            const mode = card.dataset.mode;
            if (mode === 'rapid') startTest('rapid');
            else if (mode === 'full') startTest('full');
            else if (mode === 'book') showBookView();
            document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
        });
    });
    resetTestBtn.addEventListener('click', resetToModeSelect);
    prevBtn.addEventListener('click', goPrevPage);
    nextBtn.addEventListener('click', goNextPage);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>易命术 · 处世自测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0ede7;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            padding: 1.5rem 1rem;
            color: #2c2b28;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.05);
            overflow: hidden;
            padding: 1.8rem 2rem 2.5rem;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 650;
            letter-spacing: -0.5px;
            border-left: 6px solid #b87c4f;
            padding-left: 1rem;
        }
        .sub {
            color: #6b6258;
            margin-top: 0.3rem;
            margin-bottom: 1.5rem;
            padding-left: 1rem;
            font-size: 0.9rem;
        }
        .mode-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .mode-card {
            flex: 1;
            background: #fefaf5;
            border: 2px solid #ede3d6;
            border-radius: 1.5rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-card.active {
            border-color: #b87c4f;
            background: #fff6ed;
            box-shadow: 0 4px 12px rgba(184,124,79,0.15);
        }
        .mode-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .mode-card p {
            font-size: 0.8rem;
            color: #6b5c4b;
        }
        .book-view {
            background: #fefaf5;
            border-radius: 1.5rem;
            padding: 1.2rem;
            max-height: 70vh;
            overflow-y: auto;
        }
        .art-item {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #e9e0d4;
            padding-bottom: 1rem;
        }
        .art-title {
            font-weight: 700;
            color: #b87c4f;
            margin-bottom: 0.2rem;
        }
        .art-original {
            font-family: monospace;
            background: #f3ede5;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            display: inline-block;
            font-size: 0.8rem;
            margin: 0.3rem 0;
        }
        .art-trans {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #4b3e2e;
        }
        .art-eval {
            font-size: 0.85rem;
            color: #b1624b;
            margin-top: 0.3rem;
            background: #fff0e6;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            display: inline-block;
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin: 0.5rem 0 0.2rem;
            color: #6b5c4b;
        }
        .progress {
            background: #e9e2d8;
            border-radius: 20px;
            height: 8px;
            width: 100%;
            margin-bottom: 1.5rem;
        }
        .progress-bar {
            background: #b87c4f;
            width: 0%;
            height: 8px;
            border-radius: 20px;
            transition: width 0.2s;
        }
        .question-card {
            background: #fefaf5;
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid #ede3d6;
        }
        .q-text {
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 0.8rem;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: space-between;
        }
        .opt {
            flex: 1;
            text-align: center;
            background: white;
            border: 1px solid #ddd2c4;
            border-radius: 2rem;
            padding: 0.45rem 0;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
            color: #5e5548;
        }
        .opt.selected {
            background: #b87c4f;
            border-color: #b87c4f;
            color: white;
        }
        .opt span {
            font-size: 0.7rem;
            display: block;
            opacity: 0.8;
        }
        .load-more-btn {
            background: #e2d9cf;
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: 600;
            margin: 0.5rem 0 1rem;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .load-more-btn:hover {
            background: #d1c5b6;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            margin: 1rem 0 0.5rem;
        }
        .btn-primary, .btn-secondary {
            flex: 1;
            border: none;
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary {
            background: #2c2b28;
            color: white;
        }
        .btn-primary:hover {
            background: #4a3b2e;
        }
        .btn-secondary {
            background: #e2d9cf;
            color: #2c2b28;
        }
        .result-area {
            background: #f6f2eb;
            border-radius: 1.8rem;
            padding: 1.8rem;
            margin-top: 2rem;
            border-left: 6px solid #b87c4f;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 1rem 0 0.8rem;
            padding-bottom: 4px;
            border-bottom: 2px solid #e0d4c6;
        }
        .strength-item, .weakness-item {
            background: #fffcf7;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .summary-box {
            background: #eae1d4;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1.2rem;
        }
        .hidden {
            display: none;
        }
        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            color: #aa9f90;
            margin-top: 2rem;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>易命术 · 处世自测</h1>
    <div class="sub">观照当下 · 修补气运缝隙</div>

    <div class="mode-selector" id="modeSelector">
        <div class="mode-card" data-mode="rapid">
            <h3>⚡ 极速测试</h3>
            <p>随机40题 · 覆盖全维度 · 约5分钟</p>
        </div>
        <div class="mode-card" data-mode="full">
            <h3>📚 完整测试</h3>
            <p>全量题库 · 深度自省 · 约15分钟</p>
        </div>
        <div class="mode-card" data-mode="book">
            <h3>📖 命书阅读</h3>
            <p>原文+白话+评价 · 随时翻阅</p>
        </div>
    </div>

    <div id="bookView" class="book-view hidden"></div>

    <div id="testView" class="hidden">
        <div class="progress-stats">
            <span>📋 已答: <span id="answeredCount">0</span> / <span id="totalCountSpan">0</span></span>
            <span>🧘 每次加载5题，可随时提交</span>
        </div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <div id="questionsArea"></div>
        <div id="loadMoreContainer" style="text-align: center;"></div>
        <div class="btn-group">
            <button id="submitTestBtn" class="btn-primary">📜 解读命术图谱</button>
            <button id="resetTestBtn" class="btn-secondary">🔄 重置所有答案</button>
            <button id="backToModeBtn" class="btn-secondary">🏠 返回模式选择</button>
        </div>
    </div>

    <div id="resultArea" class="result-area" style="display: none;"></div>
    <div class="footer-note">所有题目询问近期状态，凭第一直觉作答(5→非常符合，1→完全不符)。</div>
</div>

<script>
    // 全局数据
    let fullQuestionBank = [];
    let bookData = [];
    let currentQuestions = [];
    let currentAnswers = [];
    let currentMode = null; // 'rapid', 'full'
    let renderedUpTo = 0;
    const BATCH_SIZE = 5;

    // DOM 元素
    const modeSelectorDiv = document.getElementById('modeSelector');
    const bookViewDiv = document.getElementById('bookView');
    const testViewDiv = document.getElementById('testView');
    const questionsDiv = document.getElementById('questionsArea');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const answeredSpan = document.getElementById('answeredCount');
    const totalSpan = document.getElementById('totalCountSpan');
    const progressBar = document.getElementById('progressBar');
    const resultArea = document.getElementById('resultArea');

    // 辅助函数
    function updateProgressUI() {
        const answered = currentAnswers.filter(v => v !== null).length;
        answeredSpan.innerText = answered;
        totalSpan.innerText = currentQuestions.length;
        const percent = (answered / currentQuestions.length) * 100;
        progressBar.style.width = percent + '%';
    }

    function renderBatch() {
        const nextEnd = Math.min(renderedUpTo + BATCH_SIZE, currentQuestions.length);
        if (nextEnd <= renderedUpTo) return;
        for (let i = renderedUpTo; i < nextEnd; i++) {
            const q = currentQuestions[i];
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.idx = i;
            const selectedVal = currentAnswers[i];
            card.innerHTML = `
                <div class="q-text">${i+1}. ${q.text}</div>
                <div class="options" data-qidx="${i}">
                    ${[5,4,3,2,1].map(v => `<div class="opt ${selectedVal === v ? 'selected' : ''}" data-val="${v}">${v}<span>${v===5?'非常符合':v===4?'比较符合':v===3?'一般':v===2?'不太符合':'完全不符'}</span></div>`).join('')}
                </div>
            `;
            questionsDiv.appendChild(card);
        }
        renderedUpTo = nextEnd;

        // 绑定选项事件
        document.querySelectorAll(`.options[data-qidx]`).forEach(optGroup => {
            const qidx = parseInt(optGroup.dataset.qidx);
            if (qidx >= nextEnd - BATCH_SIZE && qidx < nextEnd) {
                optGroup.querySelectorAll('.opt').forEach(opt => {
                    opt.addEventListener('click', (e) => {
                        const val = parseInt(opt.dataset.val);
                        currentAnswers[qidx] = val;
                        updateProgressUI();
                        optGroup.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
                        opt.classList.add('selected');
                    });
                });
            }
        });

        if (renderedUpTo < currentQuestions.length) {
            loadMoreContainer.innerHTML = `<button class="load-more-btn" id="loadMoreBtn">📦 再加载 ${Math.min(BATCH_SIZE, currentQuestions.length - renderedUpTo)} 题</button>`;
            document.getElementById('loadMoreBtn')?.addEventListener('click', () => renderBatch());
        } else {
            loadMoreContainer.innerHTML = '<span style="font-size:0.8rem;">✅ 全部题目已加载，可提交结果</span>';
        }
        updateProgressUI();
    }

    function resetTest() {
        if (!currentQuestions.length) return;
        currentAnswers.fill(null);
        questionsDiv.innerHTML = '';
        renderedUpTo = 0;
        renderBatch();
        resultArea.style.display = 'none';
        updateProgressUI();
    }

    function computeAndShowResult() {
        const answeredCount = currentAnswers.filter(v => v !== null).length;
        if (answeredCount !== currentQuestions.length) {
            alert(`请先答完所有题目（已完成 ${answeredCount}/${currentQuestions.length}）`);
            return;
        }
        // 聚合 aspect 分数
        let aspectScores = new Map();
        for (let i=0; i<currentQuestions.length; i++) {
            const asp = currentQuestions[i].aspect;
            const score = currentAnswers[i];
            if (!aspectScores.has(asp)) aspectScores.set(asp, {total:0, count:0});
            let obj = aspectScores.get(asp);
            obj.total += score;
            obj.count++;
        }
        let results = [];
        for (let [asp, data] of aspectScores.entries()) {
            const avg = data.total / data.count;
            // 从 bookData 中找对应的术名（这里简单映射，可扩展）
            let artName = asp;
            results.push({ aspect: asp, artName, avg });
        }
        results.sort((a,b) => b.avg - a.avg);
        const strengths = results.slice(0, 3);
        const weaknesses = results.slice(-3).reverse();

        let html = `<div style="font-size:1.3rem; font-weight:600;">🧭 命术镜鉴</div>`;
        html += `<div class="section-title">✨ 根基稳固 · 长项</div>`;
        for (let s of strengths) {
            html += `<div class="strength-item"><strong>${s.artName}</strong> (得分倾向高)</div>`;
        }
        html += `<div class="section-title">🌱 待补缝隙 · 可修之域</div>`;
        for (let w of weaknesses) {
            html += `<div class="weakness-item"><strong>${w.artName}</strong> (得分倾向低)</div>`;
        }
        const strongNames = strengths.map(s=>s.artName).join('、');
        const weakNames = weaknesses.map(w=>w.artName).join('、');
        let advice = `你在「${strongNames}」上根基较好，而「${weakNames}」是目前气运易漏之处。建议针对薄弱方面，阅读命书相应条目，日常多加觉察。`;
        html += `<div class="summary-box"><strong>📖 综合箴言</strong><br>${advice}</div>`;
        resultArea.innerHTML = html;
        resultArea.style.display = 'block';
        resultArea.scrollIntoView({ behavior: 'smooth' });
    }

    function startRapidTest() {
        if (!fullQuestionBank.length) return;
        // 随机抽取40道不重复
        const shuffled = [...fullQuestionBank];
        for (let i=shuffled.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        currentQuestions = shuffled.slice(0, 40);
        currentAnswers = new Array(40).fill(null);
        renderTestInterface();
    }

    function startFullTest() {
        if (!fullQuestionBank.length) return;
        currentQuestions = [...fullQuestionBank];
        currentAnswers = new Array(fullQuestionBank.length).fill(null);
        renderTestInterface();
    }

    function renderTestInterface() {
        modeSelectorDiv.style.display = 'none';
        testViewDiv.classList.remove('hidden');
        bookViewDiv.classList.add('hidden');
        resultArea.style.display = 'none';
        questionsDiv.innerHTML = '';
        renderedUpTo = 0;
        renderBatch();
        updateProgressUI();
    }

    function showBookView() {
        if (!bookData.length) return;
        modeSelectorDiv.style.display = 'none';
        testViewDiv.classList.add('hidden');
        bookViewDiv.classList.remove('hidden');
        resultArea.style.display = 'none';
        let html = '';
        for (let art of bookData) {
            html += `<div class="art-item">
                        <div class="art-title">${art.title}</div>
                        <div class="art-original">${art.original}</div>
                        <div class="art-trans">📖 ${art.translation}</div>`;
            if (art.evaluation) {
                html += `<div class="art-eval">✍️ 评价：${art.evaluation}</div>`;
            }
            html += `</div>`;
        }
        bookViewDiv.innerHTML = html;
    }

    async function loadData() {
        try {
            const [questionsRes, bookRes] = await Promise.all([
                fetch('questions.json'),
                fetch('book.json')
            ]);
            const questionsData = await questionsRes.json();
            const bookDataRaw = await bookRes.json();
            fullQuestionBank = questionsData.questions;
            bookData = bookDataRaw.books;
            console.log(`题库加载完成: ${fullQuestionBank.length} 题`);
            // 绑定模式卡片事件
            document.querySelectorAll('.mode-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const mode = card.dataset.mode;
                    if (mode === 'rapid') startRapidTest();
                    else if (mode === 'full') startFullTest();
                    else if (mode === 'book') showBookView();
                    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                });
            });
            document.getElementById('submitTestBtn')?.addEventListener('click', computeAndShowResult);
            document.getElementById('resetTestBtn')?.addEventListener('click', resetTest);
            document.getElementById('backToModeBtn')?.addEventListener('click', () => {
                modeSelectorDiv.style.display = 'flex';
                testViewDiv.classList.add('hidden');
                bookViewDiv.classList.add('hidden');
                resultArea.style.display = 'none';
            });
        } catch (err) {
            console.error('加载数据失败', err);
            alert('数据加载失败，请刷新重试');
        }
    }

    loadData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>易命术 · 处世自测（分页版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0ede7;
            font-family: system-ui, 'Segoe UI', sans-serif;
            padding: 1.5rem 1rem;
            color: #2c2b28;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.05);
            padding: 1.8rem 2rem 2.5rem;
        }
        h1 {
            font-size: 1.9rem;
            border-left: 6px solid #b87c4f;
            padding-left: 1rem;
        }
        .sub {
            color: #6b6258;
            margin: 0.3rem 0 1.5rem 1rem;
            font-size: 0.9rem;
        }
        .mode-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .mode-card {
            flex: 1;
            background: #fefaf5;
            border: 2px solid #ede3d6;
            border-radius: 1.5rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-card.active {
            border-color: #b87c4f;
            background: #fff6ed;
            box-shadow: 0 4px 12px rgba(184,124,79,0.15);
        }
        .mode-card h3 { font-size: 1.2rem; margin-bottom: 0.3rem; }
        .mode-card p { font-size: 0.8rem; color: #6b5c4b; }
        .book-view {
            background: #fefaf5;
            border-radius: 1.5rem;
            padding: 1.2rem;
            max-height: 70vh;
            overflow-y: auto;
        }
        .art-item {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #e9e0d4;
            padding-bottom: 1rem;
        }
        .art-title {
            font-weight: 700;
            color: #b87c4f;
            margin-bottom: 0.2rem;
        }
        .art-original {
            font-family: monospace;
            background: #f3ede5;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            display: inline-block;
            font-size: 0.8rem;
            margin: 0.3rem 0;
        }
        .art-trans { font-size: 0.85rem; color: #4b3e2e; }
        .art-eval {
            font-size: 0.85rem;
            color: #b1624b;
            margin-top: 0.3rem;
            background: #fff0e6;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            display: inline-block;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            align-items: baseline;
        }
        .page-info {
            background: #e9e2d8;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
        }
        .progress-bar {
            background: #e9e2d8;
            border-radius: 20px;
            height: 8px;
            width: 100%;
            margin: 1rem 0;
        }
        .progress-fill {
            background: #b87c4f;
            width: 0%;
            height: 8px;
            border-radius: 20px;
            transition: width 0.2s;
        }
        .question-card {
            background: #fefaf5;
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid #ede3d6;
        }
        .q-text { font-weight: 500; margin-bottom: 0.8rem; }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: space-between;
        }
        .opt {
            flex: 1;
            text-align: center;
            background: white;
            border: 1px solid #ddd2c4;
            border-radius: 2rem;
            padding: 0.45rem 0;
            font-size: 0.85rem;
            cursor: pointer;
            color: #5e5548;
        }
        .opt.selected {
            background: #b87c4f;
            border-color: #b87c4f;
            color: white;
        }
        .opt span { font-size: 0.7rem; display: block; opacity: 0.8; }
        .nav-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0 0.5rem;
        }
        button {
            background: #2c2b28;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button.secondary {
            background: #e2d9cf;
            color: #2c2b28;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result-area {
            background: #f6f2eb;
            border-radius: 1.8rem;
            padding: 1.8rem;
            margin-top: 2rem;
            border-left: 6px solid #b87c4f;
        }
        .type-badge {
            background: #b87c4f20;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .hidden { display: none; }
        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            color: #aa9f90;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>易命术 · 处世自测</h1>
    <div class="sub">分页作答 · 揭示你的命术类型</div>

    <div class="mode-selector" id="modeSelector">
        <div class="mode-card" data-mode="rapid"><h3>⚡ 极速测试</h3><p>随机40题 · 分页完成</p></div>
        <div class="mode-card" data-mode="full"><h3>📚 完整测试</h3><p>全量题库 · 深度自省</p></div>
        <div class="mode-card" data-mode="book"><h3>📖 命书阅读</h3><p>原文+白话+评价</p></div>
    </div>

    <div id="bookView" class="book-view hidden"></div>

    <div id="testView" class="hidden">
        <div class="test-header">
            <span class="page-info" id="pageInfo">第1页 / 共?页</span>
            <span>总进度 <span id="totalProgress">0</span>/<span id="totalNeeded">0</span></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div id="questionsPage"></div>
        <div class="nav-buttons">
            <button id="prevPageBtn" class="secondary" disabled>◀ 上一页</button>
            <button id="nextPageBtn">下一页 ▶</button>
        </div>
        <div style="text-align:center; margin-top:1rem;">
            <button id="resetTestBtn" class="secondary">🔄 重选模式</button>
        </div>
    </div>

    <div id="resultArea" class="result-area hidden"></div>
    <div class="footer-note">每题凭直觉作答(5→非常符合，1→完全不符)。每页需全部答完才能进入下一页。</div>
</div>

<script>
    // ----------------------------- 全局变量 -----------------------------
    let fullQuestionBank = [];
    let bookData = [];
    let currentQuestions = [];
    let currentAnswers = [];
    let pageSize = 5;
    let currentPage = 0;
    let totalPages = 0;

    // DOM 元素
    const modeSelector = document.getElementById('modeSelector');
    const bookView = document.getElementById('bookView');
    const testView = document.getElementById('testView');
    const questionsPageDiv = document.getElementById('questionsPage');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const resetTestBtn = document.getElementById('resetTestBtn');
    const pageInfoSpan = document.getElementById('pageInfo');
    const totalProgressSpan = document.getElementById('totalProgress');
    const totalNeededSpan = document.getElementById('totalNeeded');
    const progressFill = document.getElementById('progressFill');
    const resultArea = document.getElementById('resultArea');

    // ----------------------------- 辅助函数 -----------------------------
    function updateProgress() {
        const answered = currentAnswers.filter(v => v !== null).length;
        totalProgressSpan.innerText = answered;
        const percent = (answered / currentQuestions.length) * 100;
        progressFill.style.width = percent + '%';
    }

    function isCurrentPageComplete() {
        const start = currentPage * pageSize;
        const end = Math.min(start + pageSize, currentQuestions.length);
        for (let i = start; i < end; i++) {
            if (currentAnswers[i] === null) return false;
        }
        return true;
    }

    function renderCurrentPage() {
        const start = currentPage * pageSize;
        const end = Math.min(start + pageSize, currentQuestions.length);
        let html = '';
        for (let i = start; i < end; i++) {
            const q = currentQuestions[i];
            const val = currentAnswers[i];
            html += `
                <div class="question-card" data-qidx="${i}">
                    <div class="q-text">${i+1}. ${q.text}</div>
                    <div class="options">
                        ${[5,4,3,2,1].map(v => `
                            <div class="opt ${val === v ? 'selected' : ''}" data-val="${v}">
                                ${v}<span>${v===5?'非常符合':v===4?'比较符合':v===3?'一般':v===2?'不太符合':'完全不符'}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        questionsPageDiv.innerHTML = html;

        // 绑定选项事件
        document.querySelectorAll('.question-card').forEach(card => {
            const qidx = parseInt(card.dataset.qidx);
            card.querySelectorAll('.opt').forEach(opt => {
                opt.addEventListener('click', () => {
                    const val = parseInt(opt.dataset.val);
                    currentAnswers[qidx] = val;
                    card.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    updateProgress();
                    updateNavButtons();
                });
            });
        });

        pageInfoSpan.innerText = `第${currentPage+1}页 / 共${totalPages}页`;
        updateProgress();
        updateNavButtons();
    }

    function updateNavButtons() {
        prevBtn.disabled = (currentPage === 0);
        if (currentPage === totalPages - 1) {
            const allDone = currentAnswers.every(v => v !== null);
            if (allDone) {
                nextBtn.innerText = '✅ 完成测试';
                nextBtn.disabled = false;
            } else {
                nextBtn.innerText = '完成测试';
                nextBtn.disabled = true;
            }
        } else {
            nextBtn.innerText = '下一页 ▶';
            nextBtn.disabled = !isCurrentPageComplete();
        }
    }

    function goPrevPage() {
        if (currentPage > 0) {
            currentPage--;
            renderCurrentPage();
        }
    }

    function goNextPage() {
        if (currentPage === totalPages - 1) {
            if (currentAnswers.every(v => v !== null)) computeAndShowResult();
            return;
        }
        if (isCurrentPageComplete() && currentPage < totalPages - 1) {
            currentPage++;
            renderCurrentPage();
        }
    }

    // ----------------------------- 人格分析 -----------------------------
    function getPersonalityType(aspectScoresMap) {
        let results = [];
        for (let [asp, data] of aspectScoresMap.entries()) {
            results.push({ aspect: asp, avg: data.total / data.count });
        }
        results.sort((a,b) => b.avg - a.avg);
        const top3 = results.slice(0,3).map(r => r.aspect);
        const bottom3 = results.slice(-3).map(r => r.aspect);
        
        if (top3.includes("introspect") && top3.includes("selfknow")) {
            return { name: "明心见性者", desc: "你善于内省，对自己有清晰认知，不易被外界带偏。这是修运的深厚根基，但需注意避免过度自省导致行动迟缓。" };
        } else if (top3.includes("allin") || top3.includes("agency")) {
            return { name: "破局开拓者", desc: "你敢于豁出去，相信命运在自己手中。行动力强，但需注意“避而俟之”的智慧，有时等待比硬冲更重要。" };
        } else if (top3.includes("social") && top3.includes("tolerance")) {
            return { name: "广结善缘者", desc: "你与人相处平等宽容，易得贵人相助。但需注意守住边界，避免过度忍让消耗自己。" };
        } else if (bottom3.includes("waste") || bottom3.includes("money")) {
            return { name: "散财待聚型", desc: "你在财务和资源管理上尚有缝隙，气运易从浪费中漏失。调整消费习惯后，运势会有明显提升。" };
        } else if (bottom3.includes("rush") || bottom3.includes("anger")) {
            return { name: "火急火燎型", desc: "你容易急躁或发火，这会扰乱心智和运气。学会慢下来、深呼吸，机会自会浮现。" };
        } else {
            return { name: "中正平和者", desc: "你各方面较为均衡，无明显短板。继续在“识己”和“内省”上深耕，可臻上乘。" };
        }
    }

    async function computeAndShowResult() {
        let aspectScores = new Map();
        for (let i=0; i<currentQuestions.length; i++) {
            const asp = currentQuestions[i].aspect;
            const score = currentAnswers[i];
            if (!aspectScores.has(asp)) aspectScores.set(asp, { total:0, count:0 });
            let obj = aspectScores.get(asp);
            obj.total += score;
            obj.count++;
        }
        let results = [];
        for (let [asp, data] of aspectScores.entries()) {
            results.push({ aspect: asp, avg: data.total/data.count });
        }
        results.sort((a,b) => b.avg - a.avg);
        const strengths = results.slice(0,3);
        const weaknesses = results.slice(-3).reverse();
        const personality = getPersonalityType(aspectScores);
        
        let html = `<div style="font-size:1.3rem; font-weight:600;">🧭 命术镜鉴</div>`;
        html += `<div class="type-badge">🏷️ 你的命术类型：${personality.name}</div>`;
        html += `<p style="margin-bottom:1rem;">${personality.desc}</p>`;
        html += `<div><strong>✨ 根基维度</strong><ul>`;
        strengths.forEach(s => html += `<li>${s.aspect} (${s.avg.toFixed(1)}分)</li>`);
        html += `</ul></div><div><strong>🌱 待修维度</strong><ul>`;
        weaknesses.forEach(w => html += `<li>${w.aspect} (${w.avg.toFixed(1)}分)</li>`);
        html += `</ul></div><div class="summary-box" style="margin-top:1rem;"><strong>📖 综合箴言</strong><br>`;
        html += `你的气运根基在于「${strengths.map(s=>s.aspect).join('、')}」，而「${weaknesses.map(w=>w.aspect).join('、')}」是当前缝隙。建议阅读命书相关条目，日常多加觉察。`;
        html += `</div><button id="backToModeBtn" class="secondary" style="margin-top:1rem;">🏠 返回模式选择</button>`;
        resultArea.innerHTML = html;
        resultArea.classList.remove('hidden');
        testView.classList.add('hidden');
        document.getElementById('backToModeBtn')?.addEventListener('click', () => {
            resultArea.classList.add('hidden');
            modeSelector.style.display = 'flex';
            testView.classList.add('hidden');
            bookView.classList.add('hidden');
        });
    }

    // ----------------------------- 开始测试 -----------------------------
    function startTest(mode) {
        if (!fullQuestionBank.length) return;
        if (mode === 'rapid') {
            const shuffled = [...fullQuestionBank];
            for (let i=shuffled.length-1; i>0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            currentQuestions = shuffled.slice(0, 40);
        } else {
            currentQuestions = [...fullQuestionBank];
        }
        currentAnswers = new Array(currentQuestions.length).fill(null);
        totalPages = Math.ceil(currentQuestions.length / pageSize);
        currentPage = 0;
        modeSelector.style.display = 'none';
        testView.classList.remove('hidden');
        bookView.classList.add('hidden');
        resultArea.classList.add('hidden');
        totalNeededSpan.innerText = currentQuestions.length;
        renderCurrentPage();
    }

    function showBookView() {
        if (!bookData.length) return;
        modeSelector.style.display = 'none';
        testView.classList.add('hidden');
        bookView.classList.remove('hidden');
        resultArea.classList.add('hidden');
        let html = '';
        for (let art of bookData) {
            html += `<div class="art-item">
                        <div class="art-title">${art.title}</div>
                        <div class="art-original">${art.original}</div>
                        <div class="art-trans">📖 ${art.translation}</div>`;
            if (art.evaluation) html += `<div class="art-eval">✍️ ${art.evaluation}</div>`;
            html += `</div>`;
        }
        bookView.innerHTML = html;
    }

    function resetToModeSelect() {
        modeSelector.style.display = 'flex';
        testView.classList.add('hidden');
        bookView.classList.add('hidden');
        resultArea.classList.add('hidden');
    }

    // ----------------------------- 加载数据 -----------------------------
    async function loadData() {
        try {
            const [qRes, bRes] = await Promise.all([
                fetch('questions.json'),
                fetch('book.json')
            ]);
            const qData = await qRes.json();
            const bData = await bRes.json();
            fullQuestionBank = qData.questions;
            bookData = bData.books;
            console.log(`题库加载完成: ${fullQuestionBank.length} 题`);

            document.querySelectorAll('.mode-card').forEach(card => {
                card.addEventListener('click', () => {
                    const mode = card.dataset.mode;
                    if (mode === 'rapid') startTest('rapid');
                    else if (mode === 'full') startTest('full');
                    else if (mode === 'book') showBookView();
                    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                });
            });
            resetTestBtn.addEventListener('click', resetToModeSelect);
            prevBtn.addEventListener('click', goPrevPage);
            nextBtn.addEventListener('click', goNextPage);
        } catch(e) {
            console.error(e);
            alert('数据加载失败，请刷新重试');
        }
    }
    loadData();
</script>
</body>
</html>
